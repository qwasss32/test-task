<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Хедер</title>
    <style>
      @font-face {

      .bottom-line {

        height: 2px;
        background-color: #21212180;
        margin: 15px auto 0;

      .menu-icon {
        position: absolute;
        left: 500px;
        top: 54px;
        display: flex;
        flex-direction: column;
        margin: 5px 0;
      }
      .menu-icon div {
        width: 40px;
        height: 2px;
        background-color: black;
        margin: 5px 0;
      }
      .title-container {
        display: flex;
        align-items: center;
        justify-content: center;
        padding-top: 45px;
      }
      .title {
        font-size: 15px;
        font-family: "Wadik", sans-serif;
        margin-left: 10px;
      }

  <body>

      <div class="title-container">
